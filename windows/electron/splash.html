<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e6e1d4;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            color: #161513; overflow: hidden;
        }
        .mark {
            width: 210px; height: auto; margin-bottom: 38px;
            display: block;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(22,21,19,0.12);
            border-top-color: #ff531a;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status {
            font-size: 13px; color: #6b675f;
            display: inline-flex; align-items: baseline; gap: 1px;
        }
        .status .dot {
            display: inline-block;
            opacity: 0.3;
            animation: pulse 1.4s infinite ease-in-out;
        }
        .status .dot:nth-child(2) { animation-delay: 0s; }
        .status .dot:nth-child(3) { animation-delay: 0.2s; }
        .status .dot:nth-child(4) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50%      { opacity: 1; }
        }
    </style>
</head>
